apiVersion: v1
kind: Namespace
metadata:
  name: gresse-minio
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: gresse-minio
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: gresse-minio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: gresse-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args:
            - server
            - /data
            - --console-address
            - :9001
          envFrom:
            - secretRef:
                name: minio-credentials
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: gresse-minio
spec:
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-proxy
  namespace: gresse-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio-proxy
  template:
    metadata:
      labels:
        app: minio-proxy
    spec:
      containers:
        - name: toxiproxy
          image: ghcr.io/shopify/toxiproxy:2.12.0
          args:
            - toxiproxy-server
            - -host
            - 0.0.0.0
          ports:
            - containerPort: 8474
              name: admin
            - containerPort: 8666
              name: proxy
        - name: configure-toxiproxy
          image: curlimages/curl:8.12.1
          command:
            - /bin/sh
            - -ec
            - |
              until curl -sf http://127.0.0.1:8474/version >/dev/null; do
                sleep 1
              done
              curl -sf -X DELETE http://127.0.0.1:8474/proxies/minio >/dev/null || true
              curl -sf -X POST http://127.0.0.1:8474/proxies \
                -H 'Content-Type: application/json' \
                -d '{"name":"minio","listen":"0.0.0.0:8666","upstream":"minio.gresse-minio.svc.cluster.local:9000"}'
              curl -sf -X POST http://127.0.0.1:8474/proxies/minio/toxics \
                -H 'Content-Type: application/json' \
                -d '{"name":"latency-upstream","type":"latency","stream":"upstream","attributes":{"latency":25,"jitter":0}}'
              curl -sf -X POST http://127.0.0.1:8474/proxies/minio/toxics \
                -H 'Content-Type: application/json' \
                -d '{"name":"latency-downstream","type":"latency","stream":"downstream","attributes":{"latency":25,"jitter":0}}'
              sleep infinity
---
apiVersion: v1
kind: Service
metadata:
  name: minio-proxy
  namespace: gresse-minio
spec:
  selector:
    app: minio-proxy
  ports:
    - name: s3
      port: 9000
      targetPort: 8666
    - name: admin
      port: 8474
      targetPort: 8474
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
  namespace: gresse-minio
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          envFrom:
            - secretRef:
                name: minio-credentials
          command:
            - /bin/sh
            - -ec
            - |
              until mc alias set local http://minio.gresse-minio.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                sleep 2
              done
              mc mb --ignore-existing local/gresse
