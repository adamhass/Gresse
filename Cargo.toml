[package]
name = "gresse"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vector_db"
path = "examples/vector_db/main.rs"

[[bin]]
name = "bench_function"
path = "examples/bench_function/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = {version = "1.0.210", features = ["derive", "rc"]}
serde_json = "1.0.140"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1.2.0", features = ["http1", "server", "client"] }
bytes = "1.0"
http-body-util = "0.1"
hyper-util = { version = "0.1.3", features = ["tokio"]}
http-body = { version = "1.0.0" }
thiserror = "2.0.12"
rand_chacha = "0.9.0"
rand = "0.9.0"
futures = "0.3"
serial_test = "3.1.1"
rand_distr = "0.5.1"
csv = "1.3.1"
itertools = "0.12"
statrs = "0.18.0"
nix = { version = "0.30.1", features = ["signal"] }
dialoguer = "0.11.0"
object_store = { version = "0.13.2", features = ["aws"] }