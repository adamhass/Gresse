[package]
name = "gresse"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["log-level-info"]
log-level-off = ["log/max_level_off", "log/release_max_level_off"]
log-level-error = ["log/max_level_error", "log/release_max_level_error"]
log-level-warn = ["log/max_level_warn", "log/release_max_level_warn"]
log-level-info = ["log/max_level_info", "log/release_max_level_info"]
log-level-debug = ["log/max_level_debug", "log/release_max_level_debug"]
log-level-trace = ["log/max_level_trace", "log/release_max_level_trace"]

[dependencies]
serde = {version = "1.0.210", features = ["derive", "rc"]}
serde_json = "1.0.140"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1.2.0", features = ["http1", "server", "client"] }
bytes = "1.0"
http-body-util = "0.1"
hyper-util = { version = "0.1.3", features = ["tokio"]}
http-body = { version = "1.0.0" }
thiserror = "2.0.12"
rand_chacha = "0.9.0"
rand = "0.9.0"
futures = "0.3"
serial_test = "3.1.1"
rand_distr = "0.5.1"
csv = "1.3.1"
itertools = "0.12"
statrs = "0.18.0"
nix = { version = "0.30.1", features = ["signal"] }
dialoguer = "0.11.0"
object_store = { version = "0.13.2", features = ["aws"] }
log = "0.4.28"
env_logger = "0.11.8"
